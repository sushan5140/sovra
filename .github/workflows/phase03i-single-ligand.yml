name: Phase 03I conservative single-ligand cohort

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase03i-single-ligand.yml"
      - "scripts/phase03i_single_ligand_preflight.py"
      - "tests/test_phase03i_single_ligand_preflight.py"

permissions:
  contents: read

jobs:
  single-ligand:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests dependency
        run: python -m pip install pyarrow==21.0.0
      - name: Run full suite before touching data
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
      - name: Download pinned metadata and predictions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sovra-data
          for name in annotations.csv all_similarity_scores.parquet predictions.tar.gz; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
              "https://zenodo.org/records/16754298/files/$name?download=1" \
              --output "/tmp/sovra-data/$name"
          done
          printf '793c711638ba20ae40518ed0e36b0a56  /tmp/sovra-data/annotations.csv\n' | md5sum -c -
          printf 'eeac5530410568f91ff3a4cdd5756e56  /tmp/sovra-data/all_similarity_scores.parquet\n' | md5sum -c -
          printf '58648b836ff9434bc929b7fad25cd9bb  /tmp/sovra-data/predictions.tar.gz\n' | md5sum -c -
      - name: Rebuild and verify candidate split
        run: |
          python scripts/phase03f_rebuild_splits.py \
            --annotations /tmp/sovra-data/annotations.csv \
            --similarity /tmp/sovra-data/all_similarity_scores.parquet \
            --manifest /tmp/sovra-data/candidate_splits_80.json \
            --out /tmp/sovra-data/phase03f_preflight.json
          printf '48ad536f241cc6f68eb86fa509ec28d6ee4f205f7bba5536c15254081aa8a29b  /tmp/sovra-data/candidate_splits_80.json\n' | sha256sum -c -
      - name: Calculate strict cohort counts only
        run: |
          python scripts/phase03i_single_ligand_preflight.py \
            --annotations /tmp/sovra-data/annotations.csv \
            --predictions /tmp/sovra-data/predictions.tar.gz \
            --manifest /tmp/sovra-data/candidate_splits_80.json \
            --out /tmp/sovra-data/phase03i_report.json
      - name: Upload aggregate only (never molecular coordinates)
        uses: actions/upload-artifact@v4
        with:
          name: phase03i-single-ligand-aggregate
          path: /tmp/sovra-data/phase03i_report.json
          retention-days: 30
