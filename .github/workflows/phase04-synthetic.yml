name: Phase 04 synthetic regression tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/phase04-synthetic.yml"
  push:
    paths:
      - "scripts/phase04_*.py"
      - "tests/test_phase04_baselines.py"
      - ".github/workflows/phase04-synthetic.yml"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing synthetic Parquet test dependency
        run: python -m pip install pyarrow==21.0.0
      - name: Run all synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q scripts tests
